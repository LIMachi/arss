import java.util.regex.Pattern

plugins {
    id 'dev.architectury.loom' version '1.6-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

//    def missing_entry_point = false
//    def entry_point = ""
    def class_extractor = Pattern.compile("class\\s+([A-Za-z_]+)\\s+extends\\s+[a-z.]*ModBase")
    def package_extractor = Pattern.compile("package\\s+([A-Za-z._]+);")
    def root = file("src/main/java")

//    task test {
//        doLast {
//            def tree = fileTree(dir: "$projectDir/src/main/java", includes: '**/*.java')
//            tree.each { file ->
//
//            }
//        }
//    }

    tasks.withType(JavaCompile).configureEach { task ->
        task.options.release = 21

        task.doFirst {
            def tmp = file("$buildDir/id-replaced-sources")
            delete tmp
            tmp.mkdirs()

            task.source.asFileTree.matching {
                include '**/*.java'
            }.each { file ->
                def t = root.toPath().relativize(file.toPath())?.toString()
                def newFile = new File(tmp, t)
                newFile.parentFile.mkdirs()
                newFile.text = file.text.replace("\$MOD_ID", archives_name)
                def extract = class_extractor.matcher(newFile.text)
                if (extract.find()) {
                    def name = extract.group(0)
                    extract = package_extractor.matcher(newFile.text)
                    if (extract.find())
                        entry_point = extract.group(0) + "." + name
                }
                if (!entry_point.empty)
                    newFile.text = newFile.text.replace("\$ENTRY_POINT", entry_point)
                else if (newFile.text.contains("\$ENTRY_POINT"))
                    missing_entry_point = true
            }

            task.source = fileTree(tmp)
        }
    }

//    throw new GradleException("entry point state: " + missing_entry_point + " -> " + entry_point);

//    if (missing_entry_point && !entry_point.empty) {
//        tasks.withType(JavaCompile).configureEach { task ->
//            task.source.asFileTree.matching {
//                include '**/*.java'
//            }.each { f ->
//                f.text = f.text.replace("\$ENTRY_POINT", entry_point)
//            }
//        }
//    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
