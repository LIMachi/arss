plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

processResources {
    from(rootProject.file("common/src/main/resources")) {
        include("${archives_name}.accesswidener")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    flatDir {
        dirs '../../LimLibArch/neoforge/build/libs'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    implementation "com.limachi.lim_lib:lim_lib-neoforge:$rootProject.lim_lib_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand  version: project.version,
                archives_name: project.archives_name,
                readable_name: project.readable_name,
                description: project.description,
                author: project.author,
                license: project.license,
                minecraft_version: project.minecraft_version,
                maven_group: project.maven_group
    }

    filesMatching('${project.archives_name}-neo.mixins.json') {
        expand  version: project.version,
                archives_name: project.archives_name,
                readable_name: project.readable_name,
                description: project.description,
                author: project.author,
                license: project.license,
                minecraft_version: project.minecraft_version,
                maven_group: project.maven_group
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    atAccessWideners.add("arss.accesswidener")
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}
