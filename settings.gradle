pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = mod_id

include 'common'
include 'fabric'
include 'neoforge'

includeBuild('../LimLibArch') {
    dependencySubstitution {
        substitute module('com.limachi.lim_lib:lim_lib-common') using project(':common')
        substitute module('com.limachi.lim_lib:lim_lib-fabric') using project(':fabric')
        substitute module('com.limachi.lim_lib:lim_lib-neoforge') using project(':neoforge')
    }
}